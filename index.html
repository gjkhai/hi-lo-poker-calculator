<html>
    <head>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
        <style>
            body {
                font-family: Lato;
            }

            .input-area input, .input-area button {
                font-weight: bold;
                font-size: 3rem;
                text-align: right;
            }

            .gy-5.gy-custom {
                --bs-gutter-y: 2rem;
            }

            button {
                font-weight: bold;
                font-size: 3rem;
                height: 6rem;
                width: 6rem;
                padding: 5%;
            }
        </style>
    </head>
    <body class="py-5">
        <div class="container">
            <div class="input-group input-area my-5 py-5">
                <input type="text" class="form-control form-control-lg" id="input-area" disabled value="">
                <button type="button" class="btn-solid theme-inverse input-group-btn" onclick="Calculate('1');">1</button>
                <button type="button" class="btn-solid theme-secondary input-group-btn" onclick="Calculate('20');">20</button>
                <button type="button" class="btn-outline theme-danger input-group-btn" onclick="Clear();">✖</button>
            </div>
            
            <hr class="my-5">
            <div class="py-5 container">
                <div class="row gy-5 gy-custom justify-content-center">
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('1');">1</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('2');">2</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('3');">3</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('4');">4</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('5');">5</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('6');">6</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('7');">7</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('8');">8</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('9');">9</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('10');">10</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-primary btn-lg" onclick="ButtonPressed('0');">0</button>
                    </div>
                    <div class="col-4 text-center">
                        <button type="button" class="btn-solid theme-accent btn-lg" onclick="ButtonPressed('CLR');">⌫</button>
                    </div>
                </div>
            </div>
            <hr class="my-5">
            <div class="py-5 container">
                <div class="d-flex justify-content-around">
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-warning btn-lg" onclick="ButtonPressed('+');">+</button>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-warning btn-lg" onclick="ButtonPressed('-');">−</button>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-warning btn-lg" onclick="ButtonPressed('x')";>✕</button>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-warning btn-lg" onclick="ButtonPressed('/');">÷</button>
                    </div>
                    <div class="text-center">
                        <button type="button" class="btn-solid theme-warning btn-lg" onclick="ButtonPressed('SQRT');">√</button>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
        <script>
            //helper functions

            function isNumeric(str) {
                if (typeof str !== 'string' || str.trim() === '') {
                    return false;
                }
                return !Number.isNaN(Number(str));
            }

            // script
            var input_area = document.getElementById("input-area");
            var value_list = [];

            var ButtonPressed = function(text) {
                if (text == "CLR") {
                    pop_value_list();
                } else {
                    update_value_list(text);
                }
            }

            var update_value_list = function(value) {
                value_list.push(value);
                update_input_area();
            }

            var pop_value_list = function() {
                value_list.pop();
                update_input_area();
            }

            var update_input_area = function() {
                let output_value = [];
                value_list.forEach(value => {
                    if (value == "-") {
                        output_value.push("−");
                    } else if (value == "x") {
                        output_value.push("✕");
                    } else if (value == "/") {
                        output_value.push("÷");
                    } else if (value == "SQRT") {
                        output_value.push("√");
                    } else {
                        output_value.push(value);
                    }
                });
                input_area.value = output_value.join(" ");
            }

            var Clear = function() {
                value_list = [];
                update_input_area();
            }

            var Simplify = function(array) {
                if (array.length == 1) {
                    return array[0];
                } else {
                    let opIndex = array.findIndex(item => item == "x" || item == "/");
                    
                    if (opIndex == -1) {
                        opIndex = array.findIndex(item => item == "+" || item == "-");
                    }

                    let left = Number(array[opIndex - 1]);
                    let operator = array[opIndex];
                    let right = Number(array[opIndex + 1]);
                    
                    let result;
                    if (operator == "x") {result = left * right};
                    if (operator == "/") {result = left / right};
                    if (operator == "+") {result = left + right};
                    if (operator == "-") {result = left - right};

                    let simple_array = [
                        ...array.slice(0, opIndex - 1),
                        result,
                        ...array.slice(opIndex + 2)
                    ];
                    return Simplify(simple_array);
                }
            }

            var Calculate = function(side) {
                let calculate_array = [...value_list];

                // checks
                for (let i = 0; i < calculate_array.length; i++) {
                    if ((calculate_array[i] == "SQRT") && (i == (calculate_array.length - 1))) {
                        window.alert("Invalid Syntax - no number after √");
                        return;
                    } else if ((calculate_array[i] == "SQRT") && (!isNumeric(calculate_array[i+1]))) {
                        window.alert("Invalid Syntax - no number after √");
                        return; 
                    }
                }
                

                for (let i = 0; i < calculate_array.length; i++) {
                    if (["+", "-", "x", "/"].includes(calculate_array[i])) {
                        if ((i == 0) || i == (calculate_array.length - 1)) {
                            window.alert("Invalid Syntax - no number before/after +−✕÷");
                            return; 
                        } else if ((!isNumeric(calculate_array[i-1])) || (!isNumeric(calculate_array[i+1]) && (calculate_array[i+1] != "SQRT"))) {
                            window.alert("Invalid Syntax - no number before/after +−✕÷");
                            return;
                        }
                    } else if ((calculate_array[i] == "SQRT") && (i != 0)) {
                        if ((calculate_array[i-1] == "SQRT") || isNumeric(calculate_array[i-1])) {
                            window.alert("Invalid Syntax - two numbers with no operation in between");
                            return;
                        }
                    }
                }

                for (let i = 0; i < calculate_array.length; i++) {
                    if (!(i == calculate_array.length - 1)) {
                        if (isNumeric(calculate_array[i]) && isNumeric(calculate_array[i+1])) {
                            window.alert("Invalid Syntax - two numbers with no operation in between");
                            return;
                        }
                    }
                }

                // sqrt
                let j = 0;
                while (j < calculate_array.length) {
                    if (calculate_array[j] == "SQRT") {
                        calculate_array[j] = Math.sqrt(parseInt(calculate_array[j+1]));
                        calculate_array.splice(j+1, 1);
                    }
                    j += 1;
                }

                // Simplify Array
                let calculated_value = Simplify(calculate_array);

                if (side == "1") {
                    window.alert(`${calculated_value} (${Math.abs(calculated_value - 1)})`);
                } else if (side == "20") {
                    window.alert(`${calculated_value} (${Math.abs(calculated_value - 20)})`);
                }
            }
        </script>
    </body>
</html>
